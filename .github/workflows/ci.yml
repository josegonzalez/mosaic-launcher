name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode:
          - cold-1
          - cold-2
          - cold-3
          - warm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config libgl-dev libsamplerate0-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev sqlite3 gdb

      - name: Build
        run: make desktop >/dev/null

      - name: First start
        run: COLD=0 xvfb-run -a bash scripts/diag-233.sh 1 12 build/diag

      - name: Starts
        run: |
          if [ "${{ matrix.mode }}" = warm ]; then
            COLD=0 xvfb-run -a bash scripts/diag-233.sh 400 12 build/diag
          else
            COLD=1 bash scripts/diag-233.sh 150 12 build/diag
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diag-${{ matrix.mode }}
          path: build/diag/
          if-no-files-found: ignore
