name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The image the check and desktop jobs run in, from docker/ci/Dockerfile,
  # tagged with a hash of it: built and pushed only when no image has that
  # tag yet, so the other jobs don't install packages every run
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: docker/ci

      - name: Image
        id: image
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr A-Z a-z)
          image="ghcr.io/$repo-ci:$(sha256sum docker/ci/Dockerfile | cut -c1-16)"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$image" >/dev/null; then
            echo "$image is there"
          else
            docker build -t "$image" docker/ci
            docker push "$image"
          fi

  check:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # privileged, so gdb can attach to a launcher that doesn't stop on
    # SIGTERM to take its stacks (SMOKE_STACKS), with an init that reaps
    # orphans, as the tests check that what they stopped is gone
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged --init
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # the C tests build against vendor/NextUI's headers

      - name: Lint
        run: make lint

      - name: Test
        run: make -j"$(nproc)" test

      # the bundled plugins together, in both slot profiles, on a virtual display
      - name: Plugin profiles
        run: xvfb-run -a make test-profiles
        env:
          SMOKE_STACKS: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: profile-logs
          path: build/profiles/
          if-no-files-found: ignore

  # the desktop build on its own and with the test plugins, on a virtual
  # display. The plugin cases are split into 3 shards, balanced by
  # tests/plugins/times.txt, and each shard's cases across JOBS workers, each
  # with its own fake card (see tests/plugins/run.sh); the first shard also
  # runs smoke, beside its workers on the card they don't use. Privileged,
  # for the workers' namespaces and gdb (SMOKE_STACKS), with an init that
  # reaps orphans
  desktop:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged --init
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Build
        run: make -j"$(nproc)" desktop

      - name: Plugin tests
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then
            xvfb-run -a make -j2 smoke test-plugins
          else
            xvfb-run -a make test-plugins
          fi
        env:
          SHARD: ${{ matrix.shard }}/3
          JOBS: 4
          SMOKE_STACKS: 1

      - name: Times
        if: always()
        run: |
          {
            echo '### Shard ${{ matrix.shard }}'
            echo '```'
            ./scripts/test-times.sh summary build/tests/plugins 15
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # for scripts/test-times.sh fetch, which updates tests/plugins/times.txt
      - name: Upload times
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-times-${{ matrix.shard }}
          path: |
            build/tests/plugins/cases.tsv
            build/tests/plugins/starts.tsv
          if-no-files-found: ignore

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-logs-${{ matrix.shard }}
          path: |
            build/*.log
            build/tests/plugins/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        platform:
          - tg5040
          - tg5050
          - h700
    container:
      image: ghcr.io/loveretro/${{ matrix.platform }}-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Build
        run: make -C launcher PLATFORM=${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextui-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/nextui.elf

  # One aarch64 build of the bundled plugins, in the oldest sysroot, runs on
  # every device.
  plugins:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # the sync plugin's programs, from pinned downloads checked against
      # plugins/sync/tools/SHA256SUMS; a mismatch fails the build
      - name: Sync tools
        run: sh plugins/sync/tools/build.sh build/sync-tools/aarch64

      - name: Build
        run: make -C plugins ARCH=aarch64 CC="${CROSS_COMPILE}gcc" OUT="$PWD/build/plugins"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugins
          path: build/plugins

  package:
    needs:
      - check
      - desktop
      - build
      - plugins
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: nextui-*

      - name: Download plugins
        uses: actions/download-artifact@v8.0.2
        with:
          name: plugins
          path: build/plugins

      - name: Place builds
        run: |
          for platform in tg5040 tg5050 h700; do
            mkdir -p "build/$platform"
            mv "nextui-$platform/nextui.elf" "build/$platform/nextui.elf"
          done

      - name: Package
        run: ./scripts/package.sh "$(git describe --tags --always)" tg5040 tg5050 h700

      - name: Upload pak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Launcher.pak.zip
          path: build/Launcher.pak.zip
