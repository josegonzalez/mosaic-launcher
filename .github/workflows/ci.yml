name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # the C tests build against vendor/NextUI's headers

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config libgl-dev libsamplerate0-dev xvfb

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # the bundled plugins together, in both slot profiles, on a virtual display
      - name: Plugin profiles
        run: xvfb-run -a make test-profiles

  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        platform:
          - tg5040
          - tg5050
          - h700
    container:
      image: ghcr.io/loveretro/${{ matrix.platform }}-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Build
        run: make -C launcher PLATFORM=${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextui-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/nextui.elf

  # One aarch64 build of the bundled plugins, in the oldest sysroot, runs on
  # every device.
  plugins:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        run: make -C plugins ARCH=aarch64 CC="${CROSS_COMPILE}gcc" OUT="$PWD/build/plugins"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugins
          path: build/plugins

  package:
    needs:
      - check
      - build
      - plugins
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: nextui-*

      - name: Download plugins
        uses: actions/download-artifact@v8.0.2
        with:
          name: plugins
          path: build/plugins

      - name: Place builds
        run: |
          for platform in tg5040 tg5050 h700; do
            mkdir -p "build/$platform"
            mv "nextui-$platform/nextui.elf" "build/$platform/nextui.elf"
          done

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE=1 ./scripts/package.sh "${GITHUB_REF_NAME}" tg5040 tg5050 h700
          else
            ./scripts/package.sh "$(git describe --tags --always)" tg5040 tg5050 h700
          fi

      - name: Upload pak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Launcher.pak.zip
          path: build/Launcher.pak.zip

      - name: Release
        if: github.ref_type == 'tag'
        run: gh release create "${GITHUB_REF_NAME}" build/Launcher.pak.zip --title "${GITHUB_REF_NAME}" --notes-from-tag
