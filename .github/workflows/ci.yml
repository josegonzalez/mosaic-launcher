name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # the C tests build against vendor/NextUI's headers

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck gettext libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config libgl-dev libsamplerate0-dev xvfb gdb

      # so a launcher that doesn't stop on SIGTERM can have its stacks taken (SMOKE_STACKS)
      - name: Allow attaching gdb
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # the bundled plugins together, in both slot profiles, on a virtual display
      - name: Plugin profiles
        run: xvfb-run -a make test-profiles
        env:
          SMOKE_STACKS: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: profile-logs
          path: build/profiles/
          if-no-files-found: ignore

  # the desktop build on its own and with the test plugins, on a virtual
  # display; ffmpeg and sqlite3 make the clips and play history some cases use.
  # The plugin cases are split into 3 shards by the "# shard:" line in each
  # tests/plugins/cases file, each with its own fake card; the first also
  # runs smoke
  desktop:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config libgl-dev libsamplerate0-dev xvfb ffmpeg libavformat-dev libavcodec-dev libavutil-dev sqlite3 gdb

      # so a start that stalls, or a launcher that doesn't stop on SIGTERM,
      # can have its stacks taken (SMOKE_STACKS)
      - name: Allow attaching gdb
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Smoke
        if: matrix.shard == 1
        run: xvfb-run -a make smoke
        env:
          SMOKE_STACKS: 1

      - name: Plugin tests
        run: xvfb-run -a make test-plugins
        env:
          SHARD: ${{ matrix.shard }}/3
          SMOKE_STACKS: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-logs-${{ matrix.shard }}
          path: |
            build/*.log
            build/tests/plugins/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        platform:
          - tg5040
          - tg5050
          - h700
    container:
      image: ghcr.io/loveretro/${{ matrix.platform }}-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Build
        run: make -C launcher PLATFORM=${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextui-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/nextui.elf

  # One aarch64 build of the bundled plugins, in the oldest sysroot, runs on
  # every device.
  plugins:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        run: make -C plugins ARCH=aarch64 CC="${CROSS_COMPILE}gcc" OUT="$PWD/build/plugins"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugins
          path: build/plugins

  package:
    needs:
      - check
      - desktop
      - build
      - plugins
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: nextui-*

      - name: Download plugins
        uses: actions/download-artifact@v8.0.2
        with:
          name: plugins
          path: build/plugins

      - name: Place builds
        run: |
          for platform in tg5040 tg5050 h700; do
            mkdir -p "build/$platform"
            mv "nextui-$platform/nextui.elf" "build/$platform/nextui.elf"
          done

      - name: Package
        run: ./scripts/package.sh "$(git describe --tags --always)" tg5040 tg5050 h700

      - name: Upload pak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Launcher.pak.zip
          path: build/Launcher.pak.zip
