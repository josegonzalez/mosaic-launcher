name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        run: make build CC="${CROSS_COMPILE}gcc"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lib
          path: lib

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download build
        uses: actions/download-artifact@v8.0.2
        with:
          name: lib
          path: lib

      - name: Package
        run: make pak

      - name: Upload pak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pak
          path: build/*.pak.zip
